name: Mogwser Build

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-x86_64
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Copy mozconfig
        shell: bash
        run: cp mozconfigs/${{ matrix.platform }} engine/mozconfig

      - name: Download and bootstrap Firefox
        run: npm run init

      - name: Build Mogwser
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mogwser-${{ matrix.platform }}
          path: engine/obj-*/dist/mogwser-*
